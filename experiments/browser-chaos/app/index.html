<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chaos target</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 40rem; }
  nav a { margin-right: .75rem; }
  button { margin: .2rem .3rem .2rem 0; padding: .3rem .6rem; }
  .muted { color: #666; font-size: .9rem; }
  .goal { background: #0a0; color: #fff; padding: 1rem; }
  /*
    The bug `?overlay=1` turns on: a tip card whose backdrop stays in the
    layout after the card is styled away, so a transparent full-screen
    layer keeps swallowing every click. This is a real and common CSS
    mistake, and it is invisible in three ways at once — nothing renders,
    nothing is logged, and the page text is unchanged. Only the geometry
    knows. See docs/25.
  */
  #tip-backdrop { position: fixed; inset: 0; z-index: 50; background: transparent; }
  #tip-card { position: fixed; right: 1rem; bottom: 1rem; z-index: 51;
              background: #fffbe6; border: 1px solid #e0c000; padding: .6rem; }
</style>
</head>
<body>
<!--
  A deliberately gated shop. The only way to #/confirm is

    products -> add to cart -> cart -> checkout-1 (fill email) -> next
             -> checkout-2 (fill address) -> next -> checkout-3 -> place order

  Every screen also carries decoys, and two of them undo progress ("Empty
  cart", "Delete account"). Progress lives in sessionStorage so it survives
  the reloads the crawler does between pages.

  Nothing here is Jev-specific: it is just an app where the interesting state
  is many correct clicks deep, which is where a random walk falls over.
-->
<nav>
  <a href="#/home">Home</a>
  <a href="#/products">Products</a>
  <a href="#/cart">Cart</a>
  <a href="#/settings">Settings</a>
  <a href="#/about">About</a>
  <a href="#/help">Help</a>
  <a href="#/faq">FAQ</a>
  <a href="#/blog">Blog</a>
  <a href="#/contact">Contact</a>
  <a href="#/danger">Account</a>
</nav>
<hr>
<main id="view"></main>
<p class="muted" id="status"></p>
<!--
  Only present with ?overlay=1. The card is visible and says something
  harmless; the backdrop behind it is transparent, covers the whole
  viewport, and eats every click until the card is dismissed. A picker
  reading text sees a tip it can safely ignore, clicks the control it
  wanted, and nothing happens — for as many steps as it has budget.
-->
<div id="tip-backdrop" hidden></div>
<div id="tip-card" hidden>
  <strong>New:</strong> dark mode is here.
  <button type="button" id="tip-dismiss">Dismiss tip</button>
</div>

<script>
const KEY = "chaos-target-progress";
const blank = { cart: 0, email: "", address: "", step: 0, ordered: false };

/*
  `?branches=1` makes four of the decoys real. Each is a NAMED function
  that changes internal state and the status line but never the hash, so
  it is invisible to novelty measured over URLs — which is what both
  chaosbringer's crawler and the pickers in docs/05 use. V8 coverage can
  see them, which is the whole question docs/26 asks. Off by default so
  the numbers in docs/05 keep reproducing.
*/
const BRANCHES = new URLSearchParams(location.search).get("branches") === "1";
const extra = { promo: false, compared: false, newsletter: false, wrapped: false };

function applyPromoCode() { extra.promo = true; render(); }
function compareSelected() { extra.compared = true; render(); }
function subscribeToNewsletter() { extra.newsletter = !extra.newsletter; render(); }
function addGiftWrap() { extra.wrapped = true; render(); }

function load() {
  try { return { ...blank, ...JSON.parse(sessionStorage.getItem(KEY) || "{}") }; }
  catch { return { ...blank }; }
}
function save(s) {
  try { sessionStorage.setItem(KEY, JSON.stringify(s)); } catch {}
}
let state = load();
function update(patch) { state = { ...state, ...patch }; save(state); render(); }

// Every state the app has entered, for the harness to read back.
window.__visited = window.__visited || [];

const decoys = (names) => names
  .map((n) => `<button type="button" data-decoy="1">${n}</button>`)
  .join("");

const routes = {
  "#/home": () => `
    <h1>Welcome</h1>
    <p>Browse the catalogue to get started.</p>
    ${decoys(["Subscribe to newsletter", "Take the tour", "Dismiss banner", "Change language"])}`,

  "#/products": () => `
    <h1>Products</h1>
    <p>Three things you can buy.</p>
    <button type="button" id="add">Add Widget to cart</button>
    <button type="button" id="add2">Add Gadget to cart</button>
    ${decoys(["Sort by price", "Filter in stock", "Add Widget to wishlist", "Compare selected", "Share catalogue"])}`,

  "#/cart": () => state.cart > 0 ? `
    <h1>Cart</h1>
    <p>${state.cart} item(s) in your cart.</p>
    <button type="button" id="checkout">Proceed to checkout</button>
    <button type="button" id="empty">Empty cart</button>
    ${decoys(["Apply promo code", "Save cart for later", "Continue shopping"])}` : `
    <h1>Cart</h1>
    <p>Your cart is empty. Add something from Products first.</p>
    ${decoys(["Apply promo code", "Continue shopping"])}`,

  "#/checkout-1": () => state.cart === 0 ? `
    <h1>Checkout</h1><p>Nothing to check out.</p>` : `
    <h1>Checkout — step 1 of 3</h1>
    <label for="email">Email address</label>
    <input id="email" type="email" placeholder="you@example.com" value="${state.email}">
    <button type="button" id="next1">Continue to delivery</button>
    <button type="button" id="back1">Back to cart</button>
    ${decoys(["Use a different account", "Checkout as guest"])}`,

  "#/checkout-2": () => !state.email ? `
    <h1>Checkout</h1><p>Enter your email first.</p>` : `
    <h1>Checkout — step 2 of 3</h1>
    <label for="address">Delivery address</label>
    <input id="address" type="text" placeholder="1 Example Street" value="${state.address}">
    <button type="button" id="next2">Continue to payment</button>
    <button type="button" id="back2">Back to email</button>
    ${decoys(["Pick up in store", "Add delivery note"])}`,

  "#/checkout-3": () => !state.address ? `
    <h1>Checkout</h1><p>Enter your address first.</p>` : `
    <h1>Checkout — step 3 of 3</h1>
    <p>Widget, delivered to ${state.address}.</p>
    <button type="button" id="place">Place order</button>
    <button type="button" id="back3">Back to delivery</button>
    ${decoys(["Add gift wrap", "Apply store credit"])}`,

  "#/confirm": () => `
    <h1 class="goal">Order placed — thank you!</h1>
    <p>This is the deepest state in the app.</p>`,

  "#/danger": () => `
    <h1>Account</h1>
    <button type="button" id="wipe">Delete account and all data</button>
    ${decoys(["Export data", "Change password", "Enable two-factor"])}`,
};

for (const dead of ["#/settings", "#/about", "#/help", "#/faq", "#/blog", "#/contact"]) {
  const name = dead.slice(2);
  routes[dead] = () => `
    <h1>${name}</h1>
    <p>Nothing important happens here.</p>
    ${decoys([`Edit ${name}`, "Send feedback", "Print page", "Copy link"])}`;
}

function render() {
  const hash = location.hash || "#/home";
  const view = routes[hash] || (() => `<h1>Not found</h1>`);
  document.getElementById("view").innerHTML = view();
  document.title = `Chaos target — ${hash}`;
  if (window.__visited[window.__visited.length - 1] !== hash) window.__visited.push(hash);
  document.getElementById("status").textContent =
    `cart=${state.cart} email=${state.email ? "set" : "empty"} ` +
    `address=${state.address ? "set" : "empty"} ordered=${state.ordered}` +
    (BRANCHES
      ? ` promo=${extra.promo} compared=${extra.compared}` +
        ` newsletter=${extra.newsletter} giftwrap=${extra.wrapped}`
      : "");
  wire();
}

function go(hash) { location.hash = hash; }

function wire() {
  const on = (id, fn) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("click", fn);
  };
  on("add", () => update({ cart: state.cart + 1 }));
  on("add2", () => update({ cart: state.cart + 1 }));
  on("checkout", () => go("#/checkout-1"));
  on("empty", () => update({ cart: 0, step: 0 }));
  on("next1", () => {
    const v = (document.getElementById("email") || {}).value || "";
    if (v.trim()) { update({ email: v.trim() }); go("#/checkout-2"); }
  });
  on("next2", () => {
    const v = (document.getElementById("address") || {}).value || "";
    if (v.trim()) { update({ address: v.trim() }); go("#/checkout-3"); }
  });
  on("place", () => { update({ ordered: true }); go("#/confirm"); });
  on("back1", () => go("#/cart"));
  on("back2", () => go("#/checkout-1"));
  on("back3", () => go("#/checkout-2"));
  on("wipe", () => { state = { ...blank }; save(state); go("#/home"); });

  // The four real branches. Wired by the decoy's own label so the
  // candidate list is byte-identical with and without ?branches=1 — the
  // only difference is whether the click does anything.
  if (!BRANCHES) return;
  const onLabel = (label, fn) => {
    for (const b of document.querySelectorAll("#view button[data-decoy]")) {
      if (b.textContent.trim() === label) b.addEventListener("click", fn);
    }
  };
  onLabel("Apply promo code", applyPromoCode);
  onLabel("Compare selected", compareSelected);
  onLabel("Subscribe to newsletter", subscribeToNewsletter);
  onLabel("Add gift wrap", addGiftWrap);
}

// `?overlay=1` arms the invisible-backdrop bug. Default off, so the
// numbers in docs/05 keep reproducing.
if (new URLSearchParams(location.search).get("overlay") === "1") {
  const backdrop = document.getElementById("tip-backdrop");
  const card = document.getElementById("tip-card");
  backdrop.hidden = false;
  card.hidden = false;
  document.getElementById("tip-dismiss").addEventListener("click", () => {
    backdrop.hidden = true;
    card.hidden = true;
  });
}

window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
